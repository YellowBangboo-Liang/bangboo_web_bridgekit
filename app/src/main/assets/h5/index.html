<!-- BridgeKit Offline H5 Demo · Author: 梁鸿禄 -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BridgeKit Offline H5</title>
<style>:root{--ink:#12323b;--brand:#006875;--line:#d6e5e8;--paper:#f7fafb}*{box-sizing:border-box}body{margin:0;padding:14px;font:14px system-ui,sans-serif;color:var(--ink);background:var(--paper)}h1{margin:0 0 4px;font-size:18px}p{margin:0 0 12px;color:#49636a}button{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-align:left;font-weight:650}#log{margin-top:10px;padding:10px;min-height:84px;border-radius:9px;background:#eaf4f5;color:#244950;font-size:12px;line-height:1.55}#log div{padding:2px 0;border-bottom:1px dashed #c4dde1}.tag{color:var(--brand);font-weight:700}</style></head>
<body><h1>Offline H5 <span class="tag">JSBridge</span></h1><p>页面完全内置于 assets，下面每项展示容器能力。</p>
<button onclick="deviceInfo()">JS → Native：读取设备信息（Promise）</button><button onclick="encodeText()">JS → Native：Base64 编码</button><button onclick="showToast()">JS → Native：触发 Android Toast</button><button onclick="schemeShare()">JS → URL Scheme：分发 share 动作</button><button onclick="noteDemo()">JS → Native：发送 Demo 记录</button><div id="log">等待 bridge 注入…</div>
<script>function log(m){var l=document.createElement('div');l.textContent='['+new Date().toLocaleTimeString()+'] '+m;document.getElementById('log').prepend(l)}function call(m,p){if(!window.JSBridge){log('Bridge 正在注入，请稍候');return Promise.reject(new Error('Bridge unavailable'))}return window.JSBridge.call(m,p)}function deviceInfo(){call('device.info',{}).then(function(v){log('✓ '+v)}).catch(function(e){log('✗ '+e.message)})}function encodeText(){call('crypto.base64',{text:'hello BridgeKit'}).then(function(v){log('✓ Base64: '+v)})}function showToast(){call('toast.show',{message:'来自离线 H5 的 Toast'}).then(function(){log('✓ Toast 已交给 Native')})}function schemeShare(){location.href='jsbridge://share?param='+encodeURIComponent('BridgeKit 离线演示')}function noteDemo(){call('demo.note',{message:'H5 主动上报'}).then(function(v){log('✓ '+v)})}window.addEventListener('nativeEvent',function(e){log('← Native 主动事件：'+e.detail.method+' '+JSON.stringify(e.detail.params))})</script></body></html>
